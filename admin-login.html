<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCare Mukkam | Admin Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #1e3a8a; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .error { color: #dc2626; margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Admin Login</h2>
    <form id="loginForm" action="javascript:void(0);">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required placeholder="admin@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" id="loginBtn">Login</button>
    </form>
    <div id="errorMsg" class="error"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAuV6-pSmuSPiNcrVcokaW5YMxwQ4wEhGc",
        authDomain: "icare-mukkam.firebaseapp.com",
        projectId: "icare-mukkam",
        storageBucket: "icare-mukkam.firebasestorage.app",
        messagingSenderId: "121404685611",
        appId: "1:121404685611:web:177d545ffefc78f563996e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Redirect to admin dashboard if already logged in
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "admin.html";
        }
    });

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const errorMsg = document.getElementById("errorMsg");

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";
        errorMsg.textContent = "";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = "admin.html";
        } catch (error) {
            console.error(error);
            errorMsg.textContent = "❌ Error: " + error.message;
            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
        }
    });
</script>

</body>
</html>
