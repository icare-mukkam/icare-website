<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#111827}
.topbar{background:#ff5a00;color:white;padding:8px 5%;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.topbar a{color:white;text-decoration:none;margin-left:18px}
header{background:white;position:sticky;top:0;z-index:5000;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.main-header{max-width:1400px;margin:auto;padding:14px 4%;display:flex;align-items:center;gap:25px}
.logo{min-width:170px;text-decoration:none;display:flex;align-items:center}
.logo svg{width:155px;height:auto}
.search-box{flex:1;display:flex;max-width:650px}
.search-box input{width:100%;padding:13px 18px;border:1px solid #ddd;border-right:0;border-radius:8px 0 0 8px;outline:none;font-size:15px}
.search-box button{width:55px;border:0;background:#ff5a00;color:white;border-radius:0 8px 8px 0;font-size:20px;cursor:pointer}
.header-actions{display:flex;gap:18px;align-items:center}
.header-action{border:0;background:white;cursor:pointer;font-size:14px;color:#111827}
.header-action span{display:block;font-size:22px}
.cart-count{background:#ff5a00;color:white;border-radius:50%;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;position:absolute;margin-left:-8px;margin-top:-4px}
.user-action{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbar{border-top:1px solid #eee}
.nav-inner{max-width:1400px;margin:auto;padding:0 4%;display:flex;align-items:center;overflow-x:auto;gap:5px}
/* ---- DROPDOWN ---- */
.dropdown{position:relative;display:inline-block}
.dropbtn{background:#ff5a00!important;color:white!important;border:none;padding:14px 18px;font-weight:bold;font-size:14px;border-radius:6px 6px 0 0;cursor:pointer;transition:.2s}
.dropbtn:hover{background:#e84d00!important}
.dropdown-content{display:none;position:absolute;left:0;top:100%;background:white;min-width:220px;box-shadow:0 8px 25px rgba(0,0,0,0.15);border-radius:0 0 12px 12px;z-index:1000;padding:8px 0;animation:slideDown 0.3s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.dropdown-content a{display:flex!important;align-items:center;gap:12px;padding:12px 20px!important;color:#111827!important;text-decoration:none;font-weight:500!important;font-size:14px!important;border-radius:0;transition:.2s}
.dropdown-content a:hover{background:#fff1e8;color:#ff5a00!important}
.dropdown-content.show{display:block}
.nav-inner a{padding:14px 18px;color:#111827;text-decoration:none;font-weight:bold;font-size:14px;white-space:nowrap}
.nav-inner a:hover{color:#ff5a00}
@media(max-width:800px){.dropdown-content{position:fixed;left:0;top:60px;width:100%;max-height:80vh;overflow-y:auto;border-radius:0 0 12px 12px}}
.hero{max-width:1400px;margin:20px auto;padding:0 4%}
.hero-box{min-height:390px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 80% 30%,#ff7a1a 0,#ff5a00 25%,#07182f 70%);color:white;display:flex;align-items:center;position:relative}
.hero-content{width:55%;padding:55px;position:relative;z-index:2}
.hero-content small{color:#ff9a5c;font-size:17px;font-weight:bold}
.hero-content h1{font-size:52px;line-height:1.05;margin:12px 0}
.hero-content h1 strong{color:#ff5a00}
.hero-content p{font-size:19px;margin-bottom:25px;color:#e5e7eb}
.hero-buttons a{display:inline-block;padding:13px 24px;margin-right:8px;border-radius:8px;text-decoration:none;font-weight:bold}
.shop-btn{background:#ff5a00;color:white}.service-btn{background:white;color:#111827}
.book-btn{display:inline-block;background:#ffffff;color:#ff5a00;padding:13px 24px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:16px;transition:0.3s;border:2px solid #ff5a00;animation:pulse 2s infinite}
.book-btn:hover{background:#ff5a00;color:white;transform:scale(1.05)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,0,0.4)}70%{box-shadow:0 0 0 10px rgba(255,90,0,0)}100%{box-shadow:0 0 0 0 rgba(255,90,0,0)}}
.hero-devices{position:absolute;right:4%;bottom:0;font-size:130px;letter-spacing:-35px;opacity:.95}
.features{max-width:1400px;margin:20px auto;padding:0 4%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.feature{background:white;padding:20px;border-radius:10px;display:flex;gap:13px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.feature-icon{font-size:28px;color:#ff5a00}.feature strong{display:block}.feature small{color:#6b7280}
.section{max-width:1400px;margin:0 auto;padding:55px 4%}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.section-head h2{font-size:28px}.view-all{color:#ff5a00;text-decoration:none;font-weight:bold}
.categories{display:grid;grid-template-columns:repeat(9,1fr);gap:15px}
.category{background:white;padding:18px 10px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid #eee;transition:.2s}
.category:hover{border-color:#ff5a00;transform:translateY(-3px)}
.category-icon{width:70px;height:70px;margin:auto;border-radius:50%;background:#fff1e8;display:flex;align-items:center;justify-content:center;font-size:34px}
.category p{margin-top:10px;font-weight:bold;font-size:13px}
.banners{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.banner{min-height:170px;border-radius:13px;padding:25px;color:white;background:linear-gradient(135deg,#07182f,#ff5a00);position:relative;overflow:hidden}
.banner:nth-child(2){background:linear-gradient(135deg,#0f3c72,#111827)}.banner:nth-child(3){background:linear-gradient(135deg,#ff5a00,#ff9a00)}
.banner h3{font-size:22px;margin-bottom:7px}.banner p{color:#f3f4f6;margin-bottom:15px}
.banner a{display:inline-block;padding:8px 15px;background:white;color:#111827;border-radius:6px;text-decoration:none;font-size:13px;font-weight:bold;cursor:pointer}
.shop-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.shop-tab{padding:10px 22px;border:2px solid #e5e7eb;background:white;border-radius:30px;font-weight:bold;cursor:pointer;transition:.2s;font-size:15px}
.shop-tab.active{background:#ff5a00;color:white;border-color:#ff5a00}
.shop-tab:hover{border-color:#ff5a00}
#shop .products-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.product-card{background:white;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;position:relative;transition:.2s;cursor:pointer}
.product-card:hover{transform:translateY(-4px);box-shadow:0 10px 25px rgba(0,0,0,.09)}
.product-image{height:220px;padding:0;display:flex;align-items:center;justify-content:center;background:#f8fafc;position:relative;overflow:hidden}
.product-image .slide{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.product-image .slide img{width:100%;height:100%;object-fit:contain;padding:10px;pointer-events:none}
.slide-prev,.slide-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);color:white;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:18px;z-index:5;display:flex;align-items:center;justify-content:center;transition:.2s}
.slide-prev:hover,.slide-next:hover{background:#ff5a00}
.slide-prev{left:5px}.slide-next{right:5px}
.slide-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:5}
.slide-dots .dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:.2s}
.slide-dots .dot.active{background:#ff5a00}
.product-info{padding:15px}.product-name{font-size:15px;font-weight:bold;min-height:40px}
.product-desc{color:#6b7280;font-size:13px;margin:5px 0;min-height:20px}
.price{font-size:20px;font-weight:bold;margin-top:8px}.old-price{color:#9ca3af;text-decoration:line-through;font-size:13px;margin-left:5px}
.stock{color:#16a34a;font-size:12px;margin-top:4px}.product-actions{display:flex;gap:7px;margin-top:12px}
.add-cart,.buy-now{flex:1;padding:10px;border-radius:7px;cursor:pointer;font-weight:bold}
.add-cart{border:1px solid #ff5a00;background:white;color:#ff5a00}.buy-now{border:0;background:#ff5a00;color:white}
.add-cart:hover{background:#fff1e8}.buy-now:hover{background:#e84d00}
.out-stock{background:#d1d5db!important;color:#4b5563!important;border:0!important;cursor:not-allowed}
.loading{grid-column:1/-1;background:white;padding:60px;text-align:center;border-radius:12px;color:#6b7280}
.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000}
.cart-drawer{position:absolute;right:0;top:0;height:100%;width:430px;max-width:100%;background:white;padding:22px;overflow-y:auto}
.cart-title{display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid #eee}
.close{border:0;background:none;font-size:25px;cursor:pointer}
.cart-item{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #eee}
.cart-item-name{font-weight:bold}.qty{display:flex;gap:8px;align-items:center;margin-top:8px}
.qty button{width:28px;height:28px;border:1px solid #ddd;background:white;border-radius:5px;cursor:pointer}
.remove{color:#dc2626;border:0;background:none;cursor:pointer;margin-top:5px}
.cart-bottom{padding-top:20px}.cart-total{display:flex;justify-content:space-between;font-size:21px;font-weight:bold;margin-bottom:15px}
.checkout-btn{width:100%;border:0;background:#ff5a00;color:white;padding:14px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;align-items:center;justify-content:center;padding:20px}
.modal-box{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:white;border-radius:15px;padding:25px}
.modal-box.wide{max-width:800px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:bold;margin-bottom:5px}
.form-group input,.form-group textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:7px;font-size:15px}
.form-group textarea{min-height:90px}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px}.auth-tab{flex:1;padding:11px;border:1px solid #ddd;background:#f8fafc;border-radius:7px;font-weight:bold;cursor:pointer}
.auth-tab.active{background:#ff5a00;color:white;border-color:#ff5a00}
.auth-note{font-size:13px;color:#6b7280;margin:10px 0 15px;line-height:1.5}
.auth-error{display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:10px;border-radius:7px;margin-bottom:12px;font-size:13px}
.auth-success{display:none;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:10px;border-radius:7px;margin-bottom:12px;font-size:13px}
.primary-btn{width:100%;border:0;background:#ff5a00;color:white;padding:13px;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
.secondary-btn{width:100%;border:1px solid #ff5a00;background:white;color:#ff5a00;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}
.auth-user-box{display:none;text-align:center}.auth-avatar{width:70px;height:70px;border-radius:50%;background:#fff1e8;color:#ff5a00;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px}
.pay-button{width:100%;border:0;background:#16a34a;color:white;padding:14px;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
.info-section{background:white}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.service-card{background:#f8fafc;padding:25px;border-radius:12px;border:1px solid #eee}.service-card .icon{font-size:38px;margin-bottom:10px}.service-card h3{margin-bottom:8px}
.technician-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tech-card{background:white;border-radius:12px;padding:20px;text-align:center;border:1px solid #e5e7eb;transition:.2s}
.tech-card:hover{transform:translateY(-5px);box-shadow:0 8px 25px rgba(0,0,0,.08)}
.tech-card img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #ff5a00;margin-bottom:12px}
.tech-card h3{font-size:18px;margin-bottom:4px;color:#07182f}
.tech-card .tech-area{color:#ff5a00;font-weight:bold;font-size:14px}
.tech-card .tech-exp{color:#6b7280;font-size:13px}
.tech-card .tech-desc{color:#4b5563;font-size:13px;margin:8px 0;min-height:40px}
.tech-card .tech-contact{background:#f1f5f9;padding:6px 12px;border-radius:20px;font-size:13px;display:inline-block}
/* ===== GALLERY MODAL ===== */
.gallery-box{max-width:800px!important;padding:20px!important;background:#1a1a2e!important;border-radius:16px!important}
.gallery-box .modal-header{border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:12px;margin-bottom:15px}
.gallery-box .modal-header h2{color:white;font-size:20px}
.gallery-box .modal-header .close{color:white;font-size:28px}
.gallery-container{position:relative;width:100%;height:450px;overflow:hidden;border-radius:12px;background:#0d0d1a}
.gallery-slider{display:flex;width:100%;height:100%;transition:transform 0.4s ease}
.gallery-slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.gallery-slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.gallery-prev,.gallery-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);color:white;border:none;border-radius:50%;width:44px;height:44px;font-size:24px;cursor:pointer;transition:0.3s;z-index:10;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.gallery-prev:hover,.gallery-next:hover{background:#ff5a00;transform:translateY(-50%) scale(1.1)}
.gallery-prev{left:10px}.gallery-next{right:10px}
.gallery-dots{display:flex;justify-content:center;gap:8px;margin-top:15px;padding:5px 0}
.gallery-dot{width:10px;height:10px;border-radius:50%;background:#4a4a6a;cursor:pointer;transition:0.3s;border:none}
.gallery-dot.active{background:#ff5a00;transform:scale(1.3)}
.gallery-dot:hover{background:#ff5a00}
.gallery-counter{text-align:center;color:#94a3b8;font-size:14px;margin-top:8px}
@media(max-width:600px){.gallery-container{height:300px}.gallery-prev,.gallery-next{width:32px;height:32px;font-size:16px}.gallery-box{padding:12px!important}}

/* ===== PRODUCT DETAIL VIEW (FULL PAGE OVERLAY) ===== */
.product-detail-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 99999;
    overflow-y: auto;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
}
.product-detail-overlay.active {
    display: flex;
}
.product-detail-container {
    max-width: 1100px;
    width: 100%;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: fadeInUp 0.4s ease;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.product-detail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: #f8fafc;
    border-bottom: 1px solid #e5e7eb;
}
.product-detail-header h2 {
    font-size: 20px;
    color: #07182f;
}
.detail-close {
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: #111827;
    transition: 0.3s;
    padding: 0 8px;
}
.detail-close:hover {
    color: #ff5a00;
    transform: rotate(90deg);
}
.product-detail-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    padding: 24px;
    background: white;
}
.detail-image-section {
    position: relative;
    background: #f8fafc;
    border-radius: 12px;
    overflow: hidden;
    height: 400px;
}
.detail-slider {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.4s ease;
}
.detail-slide {
    min-width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}
.detail-slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    cursor: zoom-in;
}
.detail-prev,
.detail-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.4);
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
    transition: 0.3s;
}
.detail-prev:hover,
.detail-next:hover {
    background: #ff5a00;
}
.detail-prev { left: 10px; }
.detail-next { right: 10px; }
.detail-dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
}
.detail-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #d1d5db;
    cursor: pointer;
    border: none;
    transition: 0.3s;
}
.detail-dot.active {
    background: #ff5a00;
    transform: scale(1.3);
}
.detail-info-section {
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.detail-info-section h1 {
    font-size: 28px;
    color: #07182f;
    margin-bottom: 8px;
}
.detail-info-section #detailDesc {
    font-size: 16px;
    color: #6b7280;
    line-height: 1.7;
    margin-bottom: 16px;
}
.detail-price {
    font-size: 32px;
    font-weight: bold;
    color: #ff5a00;
    margin-bottom: 6px;
}
.detail-old-price {
    font-size: 18px;
    color: #9ca3af;
    text-decoration: line-through;
    margin-left: 10px;
}
.detail-stock {
    font-size: 16px;
    color: #16a34a;
    margin-bottom: 20px;
}
.detail-actions {
    display: flex;
    gap: 12px;
}
.detail-actions button {
    flex: 1;
    padding: 14px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
.detail-add-cart {
    border: 2px solid #ff5a00;
    background: white;
    color: #ff5a00;
}
.detail-add-cart:hover {
    background: #fff1e8;
}
.detail-buy-now {
    border: none;
    background: #ff5a00;
    color: white;
}
.detail-buy-now:hover {
    background: #e84d00;
}
@media (max-width: 800px) {
    .product-detail-body {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 16px;
    }
    .detail-image-section {
        height: 300px;
    }
    .detail-info-section h1 {
        font-size: 22px;
    }
    .detail-price {
        font-size: 26px;
    }
    .detail-actions {
        flex-direction: column;
    }
    .product-detail-overlay {
        padding: 10px;
    }
}
@media (max-width: 500px) {
    .detail-image-section {
        height: 220px;
    }
    .product-detail-container {
        border-radius: 12px;
    }
}

footer{background:#07182f;color:white;padding:45px 5%}.footer-grid{max-width:1400px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:35px}
footer h3{margin-bottom:12px}footer a{display:block;color:#cbd5e1;text-decoration:none;margin:7px 0}footer p{color:#cbd5e1}
.copyright{text-align:center;border-top:1px solid #29405c;margin-top:30px;padding-top:20px;color:#94a3b8}
.whatsapp,.call{position:fixed;right:20px;width:56px;height:56px;border-radius:50%;color:white;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:25px;z-index:7000;box-shadow:0 5px 20px rgba(0,0,0,.25)}
.whatsapp{bottom:20px;background:#25d366}.call{bottom:88px;background:#2563eb}
.order-card{border:1px solid #e5e7eb;border-radius:10px;padding:15px;margin-bot
