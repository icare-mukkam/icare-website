// ========== PRODUCT DETAIL VIEW ==========
let detailProductId = null;
let detailImages = [];
let detailCurrentIndex = 0;

window.openProductDetail = function(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) {
        alert('Product not found');
        return;
    }

    detailProductId = productId;

    if (product.images && Array.isArray(product.images) && product.images.length > 0) {
        detailImages = product.images;
    } else if (product.image && product.image !== '' && product.image !== 'logo.png') {
        detailImages = [product.image];
    } else {
        detailImages = ['logo.png'];
    }

    detailCurrentIndex = 0;

    document.getElementById('detailTitle').textContent = product.name || 'Product Details';
    document.getElementById('detailName').textContent = product.name || 'Product';
    document.getElementById('detailDesc').textContent = product.description || 'No description available.';

    let priceHtml = `₹${Number(product.price || 0).toLocaleString('en-IN')}`;
    if (product.oldPrice && product.oldPrice > product.price) {
        priceHtml += ` <span class="detail-old-price">₹${Number(product.oldPrice).toLocaleString('en-IN')}</span>`;
    }
    document.getElementById('detailPrice').innerHTML = priceHtml;

    const stockEl = document.getElementById('detailStock');
    if (product.stock > 0) {
        stockEl.textContent = `✅ In Stock: ${product.stock}`;
        stockEl.style.color = '#16a34a';
    } else {
        stockEl.textContent = '❌ Out of Stock';
        stockEl.style.color = '#dc2626';
    }

    renderDetailSlider();
    document.getElementById('productDetail').classList.add('active');
    document.body.style.overflow = 'hidden';
};

window.closeProductDetail = function() {
    document.getElementById('productDetail').classList.remove('active');
    document.body.style.overflow = 'auto';
};

function renderDetailSlider() {
    const slider = document.getElementById('detailSlider');
    const dots = document.getElementById('detailDots');

    slider.innerHTML = '';
    detailImages.forEach((img, index) => {
        const slide = document.createElement('div');
        slide.className = 'detail-slide';
        slide.style.transform = `translateX(${index * 100}%)`;
        // ✅ FIX: Use a simple onclick to open gallery with productId
        slide.innerHTML = `<img src="${escapeHtml(img)}" alt="Product Image ${index + 1}" onerror="this.src='logo.png'" onclick="openGallery('${detailProductId}')">`;
        slider.appendChild(slide);
    });

    updateDetailPosition();

    dots.innerHTML = '';
    detailImages.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.className = `detail-dot ${index === detailCurrentIndex ? 'active' : ''}`;
        dot.onclick = () => goToDetail(index);
        dots.appendChild(dot);
    });
}

function updateDetailPosition() {
    const slider = document.getElementById('detailSlider');
    const slides = slider.querySelectorAll('.detail-slide');
    slides.forEach((slide, index) => {
        slide.style.transform = `translateX(${(index - detailCurrentIndex) * 100}%)`;
    });

    const dots = document.querySelectorAll('.detail-dot');
    dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === detailCurrentIndex);
    });
}

window.detailNext = function() {
    if (detailCurrentIndex < detailImages.length - 1) {
        detailCurrentIndex++;
        updateDetailPosition();
    }
};

window.detailPrev = function() {
    if (detailCurrentIndex > 0) {
        detailCurrentIndex--;
        updateDetailPosition();
    }
};

window.goToDetail = function(index) {
    if (index >= 0 && index < detailImages.length) {
        detailCurrentIndex = index;
        updateDetailPosition();
    }
};

window.detailAddToCart = function() {
    const product = allProducts.find(p => p.id === detailProductId);
    if (!product) return;
    if (product.stock <= 0) {
        alert('This product is out of stock.');
        return;
    }
    window.addToCart(product);
};

window.detailBuyNow = function() {
    const product = allProducts.find(p => p.id === detailProductId);
    if (!product) return;
    if (product.stock <= 0) {
        alert('This product is out of stock.');
        return;
    }
    window.addToCart(product);
    window.openCart();
};

// ========== GALLERY FUNCTIONS ==========
let galleryImages = [];
let galleryCurrentIndex = 0;

window.openGallery = function(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) {
        alert('Product not found');
        return;
    }

    if (product.images && Array.isArray(product.images) && product.images.length > 0) {
        galleryImages = product.images;
    } else if (product.image && product.image !== '' && product.image !== 'logo.png') {
        galleryImages = [product.image];
    } else {
        galleryImages = ['logo.png'];
    }

    galleryCurrentIndex = 0;
    document.getElementById('galleryTitle').textContent = product.name || 'Product Gallery';
    document.getElementById('galleryModal').style.display = 'flex';
    renderGallery();
};

window.closeGallery = function() {
    document.getElementById('galleryModal').style.display = 'none';
};

window.closeGalleryOutside = function(event) {
    if (event.target.id === 'galleryModal') {
        closeGallery();
    }
};

function renderGallery() {
    const slider = document.getElementById('gallerySlider');
    const dots = document.getElementById('galleryDots');
    const counter = document.getElementById('galleryCounter');

    slider.innerHTML = '';
    galleryImages.forEach((img, index) => {
        const slide = document.createElement('div');
        slide.className = 'gallery-slide';
        slide.style.transform = `translateX(${index * 100}%)`;
        slide.innerHTML = `<img src="${escapeHtml(img)}" alt="Product Image ${index + 1}" onerror="this.src='logo.png'">`;
        slider.appendChild(slide);
    });

    updateGalleryPosition();

    dots.innerHTML = '';
    galleryImages.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.className = `gallery-dot ${index === galleryCurrentIndex ? 'active' : ''}`;
        dot.onclick = () => goToGallery(index);
        dots.appendChild(dot);
    });

    counter.textContent = `${galleryCurrentIndex + 1} / ${galleryImages.length}`;
}

function updateGalleryPosition() {
    const slider = document.getElementById('gallerySlider');
    const slides = slider.querySelectorAll('.gallery-slide');
    slides.forEach((slide, index) => {
        slide.style.transform = `translateX(${(index - galleryCurrentIndex) * 100}%)`;
    });

    const dots = document.querySelectorAll('.gallery-dot');
    dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === galleryCurrentIndex);
    });

    document.getElementById('galleryCounter').textContent = `${galleryCurrentIndex + 1} / ${galleryImages.length}`;
}

window.galleryNext = function() {
    if (galleryCurrentIndex < galleryImages.length - 1) {
        galleryCurrentIndex++;
        updateGalleryPosition();
    }
};

window.galleryPrev = function() {
    if (galleryCurrentIndex > 0) {
        galleryCurrentIndex--;
        updateGalleryPosition();
    }
};

window.goToGallery = function(index) {
    if (index >= 0 && index < galleryImages.length) {
        galleryCurrentIndex = index;
        updateGalleryPosition();
    }
};

document.addEventListener('keydown', function(e) {
    if (document.getElementById('galleryModal').style.display === 'flex') {
        if (e.key === 'ArrowRight') galleryNext();
        if (e.key === 'ArrowLeft') galleryPrev();
        if (e.key === 'Escape') closeGallery();
    }
    if (document.getElementById('productDetail').classList.contains('active')) {
        if (e.key === 'ArrowRight') detailNext();
        if (e.key === 'ArrowLeft') detailPrev();
        if (e.key === 'Escape') closeProductDetail();

});

// ========== RENDER FUNCTIONS (with Product Detail click) ==========
function renderProducts(list) {
    if (!list || list.length === 0) {
        productsContainer.innerHTML = `<div class="loading">No products found.</div>`;
        return;
    }
    let html = '';
    list.forEach(p => {
        let images = [];
        if (p.images && Array.isArray(p.images) && p.images.length > 0) {
            images = p.images;
        } else if (p.image && p.image !== '' && p.image !== 'logo.png') {
            images = [p.image];
        } else {
            images = ['logo.png'];
        }

        let slidesHtml = '';
        let dotsHtml = '';
        images.forEach((img, idx) => {
            const displayStyle = idx === 0 ? 'flex' : 'none';
            slidesHtml += `
                <div class="slide" data-index="${idx}" style="display:${displayStyle};width:100%;height:100%;align-items:center;justify-content:center;">
                    <img src="${escapeHtml(img)}" alt="${escapeHtml(p.name)}" style="max-width:100%;max-height:100%;object-fit:contain;padding:10px;">
                </div>
            `;
            dotsHtml += `<span class="dot ${idx === 0 ? 'active' : ''}" data-index="${idx}" onclick="changeProductImage(this)"></span>`;
        });

        const hasMultipleImages = images.length > 1;
        const navHtml = hasMultipleImages ? `
            <button class="slide-prev" onclick="event.stopPropagation(); prevImage(this)">‹</button>
            <button class="slide-next" onclick="event.stopPropagation(); nextImage(this)">›</button>
            <div class="slide-dots">${dotsHtml}</div>
        ` : '';

        html += `
            <div class="product-card" onclick="openProductDetail('${p.id}')">
                <div class="product-image">
                    <div class="image-slider" style="width:100%;height:100%;display:flex;position:relative;">
                        ${slidesHtml}
                        ${navHtml}
                    </div>
                </div>
                <div class="product-info">
                    <div class="product-name">${escapeHtml(p.name)}</div>
                    <div class="product-desc">${escapeHtml(p.description || '')}</div>
                    <div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}
                        ${p.oldPrice && p.oldPrice > p.price ? `<span class="old-price">₹${Number(p.oldPrice).toLocaleString('en-IN')}</span>` : ''}
                    </div>
                    <div class="stock">${p.stock > 0 ? '✓ In Stock: '+p.stock : 'Out of Stock'}</div>
                    <div class="product-actions">
                        <button class="add-cart" onclick="event.stopPropagation(); addToCartFromProduct('${p.id}')" ${p.stock <= 0 ? 'disabled class="out-stock"' : ''}>${p.stock > 0 ? '🛒 Add' : 'Out of Stock'}</button>
                        <button class="buy-now" onclick="event.stopPropagation(); buyNowFromProduct('${p.id}')" ${p.stock <= 0 ? 'disabled class="out-stock"' : ''}>${p.stock > 0 ? 'Buy Now' : 'Unavailable'}</button>
                    </div>
                </div>
            </div>
        `;
    });
    productsContainer.innerHTML = html;
}
