
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iCare Mukkam | Admin Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

header{
    background:#1e3a8a;
    color:white;
    padding:15px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logout-btn{
    background:#dc2626;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    width:94%;
    max-width:1400px;
    margin:30px auto;
}

.grid{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    font-size:15px;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.add-btn{
    width:100%;
    background:#16a34a;
    color:white;
    border:0;
    padding:13px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

.add-btn:hover{
    background:#15803d;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.product{
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    background:#f8fafc;
}

.product img{
    width:100%;
    height:180px;
    object-fit:contain;
    background:white;
    border-radius:8px;
    margin-bottom:12px;
}

.product h4{
    font-size:17px;
    margin-bottom:8px;
}

.category{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:4px 8px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

.price{
    font-size:18px;
    font-weight:bold;
    margin:6px 0;
}

.stock{
    color:#475569;
    margin-bottom:8px;
}

.delete-btn{
    width:100%;
    margin-top:10px;
    background:#dc2626;
    color:white;
    border:0;
    padding:9px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.delete-btn:hover{
    background:#b91c1c;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.search-box{
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    min-width:220px;
}

.filter-box{
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:6px;
}

.count{
    background:#1e3a8a;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    font-weight:bold;
}

.status{
    margin-bottom:15px;
    padding:10px;
    border-radius:6px;
    background:#eff6ff;
    color:#1e40af;
}

@media(max-width:1000px){
    .products{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }

    .products{
        grid-template-columns:1fr;
    }

    .search-box{
        width:100%;
    }

    .filter-box{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <h2>iCare Mukkam Admin</h2>
    <button id="logoutBtn" class="logout-btn">Logout</button>
</header>

<div class="container">

    <div class="grid">

        <!-- ADD PRODUCT -->
        <div class="card">

            <h3>Add Product</h3>
            <br>

            <form id="productForm">

                <div class="form-group">
                    <label>Product Name</label>
                    <input
                        type="text"
                        id="productName"
                        placeholder="Example: Samsung Galaxy A16"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Category</label>

                    <select id="productCategory" required>

                        <option value="Mobiles">
                            Mobiles
                        </option>

                        <option value="Laptops">
                            Laptops
                        </option>

                        <option value="Tablets">
                            Tablets
                        </option>

                        <option value="Smart Watch">
                            Smart Watch
                        </option>

                        <option value="Earbuds">
                            Earbuds
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                        <option value="TV & Audio">
                            TV & Audio
                        </option>

                        <option value="Offers">
                            Offers
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Price (₹)</label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="25000"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Stock</label>

                    <input
                        type="number"
                        id="productStock"
                        placeholder="10"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Image URL / File Name</label>

                    <input
                        type="text"
                        id="productImage"
                        placeholder="samsung.jpg or image URL"
                    >
                </div>

                <div class="form-group">
                    <label>Description</label>

                    <textarea
                        id="productDescription"
                        placeholder="Product description"
                    ></textarea>
                </div>

                <button
                    type="submit"
                    id="addBtn"
                    class="add-btn"
                >
                    + Add Product
                </button>

            </form>

        </div>


        <!-- PRODUCTS -->
        <div class="card">

            <div class="top-bar">

                <h3>Products List</h3>

                <span id="productCount" class="count">
                    0 Products
                </span>

            </div>

            <div class="top-bar">

                <input
                    type="text"
                    id="searchBox"
                    class="search-box"
                    placeholder="Search products..."
                >

                <select id="filterCategory" class="filter-box">

                    <option value="All">
                        All Categories
                    </option>

                    <option value="Mobiles">
                        Mobiles
                    </option>

                    <option value="Laptops">
                        Laptops
                    </option>

                    <option value="Tablets">
                        Tablets
                    </option>

                    <option value="Smart Watch">
                        Smart Watch
                    </option>

                    <option value="Earbuds">
                        Earbuds
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                    <option value="TV & Audio">
                        TV & Audio
                    </option>

                    <option value="Offers">
                        Offers
                    </option>

                </select>

            </div>

            <div id="status" class="status">
                Loading products...
            </div>

            <div id="products" class="products"></div>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey:
        "AIzaSyAuV6-pSmuSPiNcrVcokaW5YMxwQ4wEhGc",

    authDomain:
        "icare-mukkam.firebaseapp.com",

    projectId:
        "icare-mukkam",

    storageBucket:
        "icare-mukkam.firebasestorage.app",

    messagingSenderId:
        "121404685611",

    appId:
        "1:121404685611:web:177d545ffefc78f563996e"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ELEMENTS */

const productsContainer =
    document.getElementById("products");

const statusBox =
    document.getElementById("status");

const productCount =
    document.getElementById("productCount");

const searchBox =
    document.getElementById("searchBox");

const filterCategory =
    document.getElementById("filterCategory");


let allProducts = [];


/* LOGIN CHECK */

onAuthStateChanged(auth, (user) => {

    if (user) {

        console.log(
            "Logged in:",
            user.email
        );

        loadProducts();

    } else {

        window.location.href =
            "admin-login.html";

    }

});


/* LOGOUT */

document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

        try {

            await signOut(auth);

            window.location.href =
                "admin-login.html";

        } catch (error) {

            alert(
                "Logout failed: " +
                error.message
            );

        }

    });


/* ADD PRODUCT */

document
    .getElementById("productForm")
    .addEventListener("submit", async (e) => {

        e.preventDefault();

        const addBtn =
            document.getElementById("addBtn");

        addBtn.disabled = true;

        addBtn.textContent =
            "Adding Product...";

        try {

            await addDoc(
                collection(db, "products"),
                {

                    name:
                        document
                            .getElementById("productName")
                            .value
                            .trim(),

                    category:
                        document
                            .getElementById("productCategory")
                            .value,

                    price:
                        Number(
                            document
                                .getElementById("productPrice")
                                .value
                        ),

                    stock:
                        Number(
                            document
                                .getElementById("productStock")
                                .value
                        ),

                    image:
                        document
                            .getElementById("productImage")
                            .value
                            .trim() ||
                        "logo.png",

                    description:
                        document
                            .getElementById("productDescription")
                            .value
                            .trim(),

                    createdAt:
                        new Date().toISOString()

                }
            );


            alert(
                "✅ Product Added Successfully!"
            );


            document
                .getElementById("productForm")
                .reset();


            await loadProducts();


        } catch (error) {

            console.error(error);

            alert(
                "❌ Error adding product:\n" +
                error.message
            );

        } finally {

            addBtn.disabled = false;

            addBtn.textContent =
                "+ Add Product";

        }

    });


/* LOAD ALL PRODUCTS */

async function loadProducts() {

    statusBox.textContent =
        "Loading products...";

    try {

        const snapshot =
            await getDocs(
                collection(db, "products")
            );


        allProducts = [];


        snapshot.forEach((docSnapshot) => {

            allProducts.push({

                id:
                    docSnapshot.id,

                ...docSnapshot.data()

            });

        });


        productCount.textContent =
            allProducts.length +
            " Products";


        statusBox.textContent =
            allProducts.length +
            " products found";


        renderProducts();


    } catch (error) {

        console.error(error);

        statusBox.textContent =
            "Error loading products: " +
            error.message;

        productsContainer.innerHTML = "";

    }

}


/* DISPLAY PRODUCTS */

function renderProducts() {

    const search =
        searchBox.value
            .toLowerCase()
            .trim();

    const category =
        filterCategory.value;


    const filtered =
        allProducts.filter((product) => {

            const name =
                String(product.name || "")
                    .toLowerCase();

            const productCategory =
                String(
                    product.category || ""
                );


            const searchMatch =
                name.includes(search);


            const categoryMatch =
                category === "All" ||
                productCategory === category;


            return (
                searchMatch &&
                categoryMatch
            );

        });


    productsContainer.innerHTML = "";


    if (filtered.length === 0) {

        productsContainer.innerHTML =
            "<p>No products found.</p>";

        return;

    }


    filtered.forEach((product) => {

        const div =
            document.createElement("div");

        div.className =
            "product";


        const image =
            product.image ||
            "logo.png";


        div.innerHTML = `

            <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(product.name || "Product")}"
                onerror="this.src='logo.png'"
            >

            <span class="category">
                ${escapeHTML(product.category || "Other")}
            </span>

            <h4>
                ${escapeHTML(product.name || "Unnamed Product")}
            </h4>

            <div class="price">
                ₹${Number(product.price || 0).toLocaleString("en-IN")}
            </div>

            <div class="stock">
                Stock: ${Number(product.stock || 0)}
            </div>

            <p>
                ${escapeHTML(product.description || "")}
            </p>

            <button
                class="delete-btn"
                data-id="${product.id}"
            >
                Delete
            </button>

        `;


        div
            .querySelector(".delete-btn")
            .addEventListener(
                "click",
                () => deleteProduct(product.id)
            );


        productsContainer.appendChild(div);

    });

}


/* SEARCH */

searchBox.addEventListener(
    "input",
    renderProducts
);


/* CATEGORY FILTER */

filterCategory.addEventListener(
    "change",
    renderProducts
);


/* DELETE */

async function deleteProduct(id) {

    if (
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ) {

        return;

    }


    try {

        await deleteDoc(
            doc(db, "products", id)
        );


        alert(
            "Product deleted successfully."
        );


        await loadProducts();


    } catch (error) {

        alert(
            "Error deleting product: " +
            error.message
        );

    }

}


/* SECURITY FOR DISPLAY */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
```
