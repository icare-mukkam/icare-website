<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iCare Mukkam | Admin Dashboard</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:Arial,Helvetica,sans-serif; background:#f1f5f9; color:#1e293b; }
header{ background:#1e3a8a; color:white; padding:15px 5%; display:flex; align-items:center; justify-content:space-between; }
.logout-btn{ background:#dc2626; color:white; border:0; padding:10px 18px; border-radius:6px; cursor:pointer; font-weight:bold; }
.container{ width:92%; max-width:1200px; margin:35px auto; }
.card{ background:white; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,.08); margin-bottom:20px; }
.grid{ display:grid; grid-template-columns:350px 1fr; gap:25px; }
.form-group{ margin-bottom:15px; }
.form-group label{ display:block; font-weight:bold; margin-bottom:6px; }
.form-group input, .form-group textarea, .form-group select{ width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; }
.add-btn{ width:100%; background:#16a34a; color:white; border:0; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; }
.products{ display:grid; grid-template-columns:repeat(2,1fr); gap:15px; }
.product{ border:1px solid #e2e8f0; border-radius:8px; padding:15px; background:#f8fafc; }
.delete-btn{ width:100%; margin-top:10px; background:#dc2626; color:white; border:0; padding:8px; border-radius:6px; cursor:pointer; }
@media(max-width:800px){ .grid{ grid-template-columns:1fr; } .products{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header>
    <h2>iCare Mukkam Admin</h2>
    <button id="logoutBtn" class="logout-btn">Logout</button>
</header>

<div class="container">
    <div class="grid">
        <div class="card">
            <h3>Add Product</h3><br>
            <form id="productForm">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="productCategory">
                        <option value="Mobile">Mobile</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="productPrice" required>
                </div>
                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" id="productStock" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="productImage" placeholder="logo.png">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDescription"></textarea>
                </div>
                <button type="submit" id="addBtn" class="add-btn">+ Add Product</button>
            </form>
        </div>

        <div class="card">
            <h3>Products List</h3><br>
            <div id="products" class="products">
                <div>Loading products...</div>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAuV6-pSmuSPiNcrVcokaW5YMxwQ4wEhGc",
    authDomain: "icare-mukkam.firebaseapp.com",
    projectId: "icare-mukkam",
    storageBucket: "icare-mukkam.firebasestorage.app",
    messagingSenderId: "121404685611",
    appId: "1:121404685611:web:177d545ffefc78f563996e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const productsContainer = document.getElementById("products");

// Auth State Check to prevent infinite loop
onAuthStateChanged(auth, (user) => {
    if (user) {
        console.log("Logged in user:", user.email);
        loadProducts();
    } else {
        window.location.href = "admin-login.html";
    }
});

// Handle Logout
document.getElementById("logoutBtn").addEventListener("click", async () => {
    try {
        await signOut(auth);
        window.location.href = "admin-login.html";
    } catch (err) {
        alert("Logout failed: " + err.message);
    }
});

// Add New Product
document.getElementById("productForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
        await addDoc(collection(db, "products"), {
            name: document.getElementById("productName").value,
            category: document.getElementById("productCategory").value,
            price: Number(document.getElementById("productPrice").value),
            stock: Number(document.getElementById("productStock").value),
            image: document.getElementById("productImage").value || "logo.png",
            description: document.getElementById("productDescription").value,
            createdAt: new Date().toISOString()
        });
        alert("Product Added Successfully!");
        document.getElementById("productForm").reset();
        loadProducts();
    } catch (err) {
        alert("Error adding product: " + err.message);
    }
});

// Load Products from Firestore
async function loadProducts() {
    productsContainer.innerHTML = "Loading...";
    try {
        const snapshot = await getDocs(collection(db, "products"));
        if (snapshot.empty) {
            productsContainer.innerHTML = "No products found.";
            return;
        }
        productsContainer.innerHTML = "";
        snapshot.forEach((docSnapshot) => {
            const p = docSnapshot.data();
            const div = document.createElement("div");
            div.className = "product";
            div.innerHTML = `
                <h4>${p.name}</h4>
                <p>₹${p.price} | Stock: ${p.stock}</p>
                <p>${p.description || ''}</p>
                <button class="delete-btn" data-id="${docSnapshot.id}">Delete</button>
            `;
            div.querySelector(".delete-btn").addEventListener("click", () => deleteProduct(docSnapshot.id));
            productsContainer.appendChild(div);
        });
    } catch (err) {
        productsContainer.innerHTML = "Error loading products: " + err.message;
    }
}

// Delete Product from Firestore
async function deleteProduct(id) {
    if (confirm("Delete this product?")) {
        try {
            await deleteDoc(doc(db, "products", id));
            loadProducts();
        } catch (err) {
            alert("Error deleting product: " + err.message);
        }
    }
}
</script>

</body>
</html>
